<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sophon 对话</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4d;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3d8bfd;
      --user-bg: #1e3a5f;
      --assistant-bg: #252d3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      background: var(--surface);
    }
    header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
      flex: 1;
      min-width: 8rem;
    }
    header label { font-size: 0.85rem; color: var(--muted); }
    select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.35rem 0.6rem;
      min-width: 12rem;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.4rem 0.9rem;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    button.secondary {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      max-width: 52rem;
      width: 100%;
      margin: 0 auto;
    }
    .msg {
      max-width: 95%;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user-bg);
      border: 1px solid #2a5080;
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--assistant-bg);
      border: 1px solid var(--border);
    }
    .msg .role {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .msg.streaming { opacity: 0.95; }
    footer {
      padding: 1rem 1.25rem 1.25rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .composer {
      max-width: 52rem;
      margin: 0 auto;
      display: flex;
      gap: 0.6rem;
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      min-height: 3rem;
      max-height: 10rem;
      resize: vertical;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      font: inherit;
      line-height: 1.45;
    }
    textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    #status {
      max-width: 52rem;
      margin: 0 auto 0.5rem;
      font-size: 0.8rem;
      color: var(--muted);
      min-height: 1.2em;
    }
    #status.error { color: #f87171; }
  </style>
</head>
<body>
  <header>
    <h1>Sophon 对话</h1>
    <label for="sessionSelect">会话</label>
    <select id="sessionSelect" aria-label="选择会话"></select>
    <button type="button" class="secondary" id="btnNewSession">新建会话</button>
    <button type="button" class="secondary" id="btnRefresh">刷新列表</button>
  </header>
  <div id="messages" aria-live="polite"></div>
  <footer>
    <div id="status"></div>
    <div class="composer">
      <textarea id="input" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）" rows="2"></textarea>
      <button type="button" id="btnSend" disabled>发送</button>
    </div>
  </footer>

  <script>
    const $ = (id) => document.getElementById(id);
    const sessionSelect = $("sessionSelect");
    const messagesEl = $("messages");
    const inputEl = $("input");
    const btnSend = $("btnSend");
    const statusEl = $("status");

    function setStatus(text, isError) {
      statusEl.textContent = text || "";
      statusEl.classList.toggle("error", !!isError);
    }

    async function apiJson(url, options = {}) {
      const method = (options.method || "GET").toUpperCase();
      const headers = { ...(options.headers || {}) };
      if (method !== "GET" && method !== "HEAD" && !headers["Content-Type"]) {
        headers["Content-Type"] = "application/json";
      }
      const res = await fetch(url, { ...options, headers });
      if (!res.ok) {
        const t = await res.text();
        throw new Error(t || res.statusText || String(res.status));
      }
      return res.json();
    }

    async function loadSessions() {
      const list = await apiJson("/api/sessions", { method: "GET" });
      sessionSelect.innerHTML = "";
      for (const s of list) {
        const opt = document.createElement("option");
        opt.value = s.id;
        opt.textContent = (s.title || "未命名") + " · " + s.id.slice(0, 8) + "…";
        sessionSelect.appendChild(opt);
      }
      if (list.length === 0) {
        await createSession();
        return;
      }
      btnSend.disabled = false;
    }

    async function createSession() {
      const s = await apiJson("/api/sessions", {
        method: "POST",
        body: "{}",
      });
      const opt = document.createElement("option");
      opt.value = s.id;
      opt.textContent = (s.title || "web") + " · " + s.id.slice(0, 8) + "…";
      sessionSelect.appendChild(opt);
      sessionSelect.value = s.id;
      btnSend.disabled = false;
      setStatus("已创建新会话");
    }

    function currentSessionId() {
      return sessionSelect.value;
    }

    function appendMessage(role, text, streaming) {
      const wrap = document.createElement("div");
      wrap.className = "msg " + role + (streaming ? " streaming" : "");
      const roleEl = document.createElement("div");
      roleEl.className = "role";
      roleEl.textContent = role === "user" ? "你" : "助手";
      const textEl = document.createElement("div");
      textEl.className = "body";
      textEl.textContent = text;
      wrap.appendChild(roleEl);
      wrap.appendChild(textEl);
      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return textEl;
    }

    async function sendMessage() {
      const sid = currentSessionId();
      if (!sid) {
        setStatus("请先选择或创建会话", true);
        return;
      }
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = "";
      appendMessage("user", text, false);
      const bodyEl = appendMessage("assistant", "", true);

      btnSend.disabled = true;
      setStatus("正在生成…");

      try {
        const res = await fetch("/api/sessions/" + encodeURIComponent(sid) + "/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        if (!res.ok) {
          const errText = await res.text();
          throw new Error(errText || res.statusText);
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          bodyEl.textContent += decoder.decode(value, { stream: true });
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }
        bodyEl.textContent += decoder.decode();
        bodyEl.parentElement.classList.remove("streaming");
        setStatus("");
      } catch (e) {
        bodyEl.textContent = "（出错）" + (e.message || String(e));
        bodyEl.parentElement.classList.remove("streaming");
        setStatus(e.message || String(e), true);
      } finally {
        btnSend.disabled = false;
      }
    }

    $("btnNewSession").addEventListener("click", () => {
      createSession().catch((e) => setStatus(e.message, true));
    });
    $("btnRefresh").addEventListener("click", () => {
      loadSessions().catch((e) => setStatus(e.message, true));
    });
    btnSend.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" && !ev.shiftKey) {
        ev.preventDefault();
        sendMessage();
      }
    });

    loadSessions().catch((e) => setStatus("加载失败：" + e.message, true));
  </script>
</body>
</html>
